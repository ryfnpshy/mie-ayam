name = "mie-ayam"
compatibility_date = "2024-06-09"
pages_build_output_dir = "public"

[vars]
APP_ENV = "production"
APP_DEBUG = "false"
DB_CONNECTION = "pgsql"
SESSION_DRIVER = "database"
CACHE_STORE = "database"
FILESYSTEM_DISK = "supabase"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "mie-ayam-assets"
